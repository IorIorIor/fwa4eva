<meta charset="utf-8">
<title>Room Props</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* layout: a night-blue showroom, one turntable per prop in a two-up grid (one column on a phone), the canvas behind them all */
:root {
  --bg: #0c1120; --card: #131a2c; --line: #232c45; --fg: #e8eaf3; --muted: #8b93ab; --lamp: #f2c14e;
  --display: "Silkscreen", "IBM Plex Mono", monospace; --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", "Courier New", monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg) }
body { font: 15px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none }
.wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto }
header { display: grid; gap: 10px; padding-block: 48px 28px; max-width: 64ch }
h1 { font: 400 clamp(30px, 6vw, 52px)/1 var(--display); margin: 0; letter-spacing: .02em; text-wrap: balance }
header p { margin: 0; color: var(--muted) }
.meta { font: 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--lamp) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 18px }
.card { display: grid; grid-template-rows: auto auto; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0 }
.stage { aspect-ratio: 4 / 3; max-width: 100%; position: relative; cursor: grab; touch-action: none }
.stage:active { cursor: grabbing }
.stage .hint { position: absolute; right: 12px; bottom: 10px; font: 11px/1 var(--mono); letter-spacing: .06em; color: var(--muted); opacity: .8; pointer-events: none }
.cap { display: grid; gap: 4px; padding: 14px 16px 16px; background: var(--card); border-top: 1px solid var(--line); min-width: 0 }
.cap h2 { font: 600 16px/1.3 var(--body); margin: 0; text-wrap: balance }
.cap p { margin: 0; color: var(--muted); font-size: 13.5px }
.cap .id { font: 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--lamp) }
.loading { font: 13px var(--mono); color: var(--muted); padding-block: 40px }
@media (prefers-reduced-motion: reduce) { .stage .hint { display: none } }
</style>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <span class="meta">FWA Forever · the desk, year 2000</span>
    <h1>Room props</h1>
    <p>Everything for the room, one at a time and at real size. Drag any of them to turn it round; double-click (or double-tap) to set it back.</p>
  </header>
  <div class="grid" id="grid"><p class="loading">Building the props…</p></div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
%%PROPS%%
const IMG = %%IMAGES%%, LOGO = %%LOGO%%;
const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src });
const [kesey, webdesign, motd, sotd, persepolis] = await Promise.all([IMG.kesey, IMG.webdesign, IMG.motd, IMG.sotd, IMG.persepolis].map(load));
try { await Promise.race([Promise.all(['20px "IBM Plex Mono"', 'bold 20px "IBM Plex Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]) } catch (e) { }

const canvas = document.getElementById('gl'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.setScissorTest(true); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c) })();

const props = makeProps(THREE, { RoundedBoxGeometry, img: { kesey, webdesign, motd, sotd, persepolis }, logo: LOGO });
const grid = document.getElementById('grid'); grid.innerHTML = '';
const views = props.map(p => {
  const card = document.createElement('article'); card.className = 'card';
  card.innerHTML = `<div class="stage" tabindex="0" aria-label="${p.name}, drag to turn"><span class="hint">drag to turn</span></div><div class="cap"><span class="id">${p.id}</span><h2>${p.name}</h2><p>${p.note}</p></div>`;
  grid.appendChild(card); const stage = card.querySelector('.stage');
  const scene = new THREE.Scene(); scene.environment = env;
  const obj = p.make(); scene.add(obj);
  const key = new THREE.DirectionalLight(0xfff1dc, 2.2); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0002; key.shadow.normalBias = .02; scene.add(key, key.target);
  scene.add(new THREE.HemisphereLight(0xbfd2ff, 0x1a1408, .5));
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3()), R = Math.max(size.x, size.y, size.z) || .1;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(R * 2.6, R * 2.6), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })); floor.rotation.x = -Math.PI / 2; floor.position.y = box.min.y - .0002; scene.add(floor);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(R * 3, R * 3), new THREE.ShadowMaterial({ opacity: .35 })); sh.rotation.x = -Math.PI / 2; sh.position.y = box.min.y - .0004; sh.receiveShadow = true; scene.add(sh);
  key.position.set(ctr.x + R * 1.2, ctr.y + R * 2.2, ctr.z + R * 1.6); key.target.position.copy(ctr); const sc = key.shadow.camera; sc.left = sc.bottom = -R * 1.5; sc.right = sc.top = R * 1.5; sc.near = R * .2; sc.far = R * 6; sc.updateProjectionMatrix();
  const cam = new THREE.PerspectiveCamera(30, 4 / 3, R * .02, R * 40), home = new THREE.Vector3();
  const dist = R / (2 * Math.tan(15 * Math.PI / 180)) * 1.25; home.set(ctr.x + dist * .55, ctr.y + dist * .42, ctr.z + dist * .72).sub(ctr).setLength(dist).add(ctr); cam.position.copy(home);
  const ctl = new OrbitControls(cam, stage); ctl.target.copy(ctr); ctl.enableZoom = false; ctl.enablePan = false; ctl.enableDamping = true; ctl.dampingFactor = .08; ctl.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches; ctl.autoRotateSpeed = 1.1; ctl.update();
  ctl.addEventListener('start', () => { ctl.autoRotate = false });
  stage.addEventListener('dblclick', () => { cam.position.copy(home); ctl.target.copy(ctr); ctl.update() });
  return { stage, scene, cam, ctl, obj, ctr, dist, id: p.id };
});
window.__views = views;   // (for scripted looks)

const bg = new THREE.Color('#0f1526');
function frame(now) {
  requestAnimationFrame(frame);
  const W = innerWidth, H = innerHeight; if (canvas.width !== Math.floor(W * renderer.getPixelRatio()) || canvas.height !== Math.floor(H * renderer.getPixelRatio())) renderer.setSize(W, H, false);
  renderer.setScissor(0, 0, W, H); renderer.setClearColor(0x000000, 0); renderer.clear();
  const t = now / 1000;
  for (const v of views) {
    const r = v.stage.getBoundingClientRect(); if (r.bottom < 0 || r.top > H || r.right < 0 || r.left > W) continue;
    v.ctl.update(); if (v.obj.userData.update) v.obj.userData.update(t); v.obj.traverse(o => { if (o !== v.obj && o.userData.update) o.userData.update(t) });
    const x = r.left, y = H - r.bottom; renderer.setViewport(x, y, r.width, r.height); renderer.setScissor(x, y, r.width, r.height); renderer.setClearColor(bg, 1); renderer.clear();
    v.cam.aspect = r.width / r.height; v.cam.updateProjectionMatrix(); renderer.render(v.scene, v.cam);
  }
}
requestAnimationFrame(frame);
</script>
